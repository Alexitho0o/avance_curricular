[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sies-procesos"
version = "0.1.0"
description = "Monorepo de procesos SIES — Infraestructura y Recursos Educacionales 2026"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.10.0",
    "pyyaml>=6.0",
    "python-docx>=0.8.11",
    "matplotlib>=3.7.0",
    "pytest>=7.0.0",
]

[project.optional-dependencies]
dev = ["black", "ruff", "pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["common", "procesos.*"]
